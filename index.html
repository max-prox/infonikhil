    async function getUserInfo() {
      const info = {};

      info.userAgent = navigator.userAgent;
      info.language = navigator.language;
      info.languages = navigator.languages;
      info.platform = navigator.platform;
      info.doNotTrack = navigator.doNotTrack;
      info.cookieEnabled = navigator.cookieEnabled;

      info.screen = {
        width: screen.width,
        height: screen.height,
        availWidth: screen.availWidth,
        availHeight: screen.availHeight,
        colorDepth: screen.colorDepth,
        pixelDepth: screen.pixelDepth
      };

      info.storage = {
        localStorage: !!window.localStorage,
        sessionStorage: !!window.sessionStorage,
        indexedDB: !!window.indexedDB
      };

      info.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      info.timezoneOffset = new Date().getTimezoneOffset();
      info.localTime = new Date().toString();

      if (navigator.getBattery) {
        try {
          const battery = await navigator.getBattery();
          info.battery = {
            level: (battery.level * 100).toFixed(0) + '%',
            charging: battery.charging
          };
        } catch {}
      }

      info.hardwareConcurrency = navigator.hardwareConcurrency;
      info.deviceMemory = navigator.deviceMemory || "N/A";
      info.touchSupport = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      info.prefersDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
      info.referrer = document.referrer || "Direct Access";

      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl");
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        info.webgl = {
          vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
          renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
        };
      } catch {
        info.webgl = "Unavailable";
      }

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const analyser = ctx.createAnalyser();
        osc.connect(analyser);
        osc.start(0);
        const fingerprint = new Float32Array(analyser.frequencyBinCount);
        analyser.getFloatFrequencyData(fingerprint);
        info.audioFingerprint = fingerprint.slice(0, 5);
        osc.stop();
        ctx.close();
      } catch {
        info.audioFingerprint = "Unavailable";
      }

      const fonts = ["Arial", "Verdana", "Times New Roman", "Courier New", "Comic Sans MS"];
      const baseWidth = {};
      const fontDiv = document.createElement("div");
      fontDiv.style.position = "absolute";
      fontDiv.style.top = "-9999px";
      fontDiv.style.left = "-9999px";
      fontDiv.style.fontSize = "72px";
      fontDiv.innerText = "mmmmmmmmmmlli";
      document.body.appendChild(fontDiv);

      fonts.forEach(font => {
        fontDiv.style.fontFamily = font;
        baseWidth[font] = fontDiv.offsetWidth;
      });
      document.body.removeChild(fontDiv);
      info.availableFonts = fonts.filter(f => baseWidth[f] > 0);

      try {
        const res = await fetch("https://ipapi.co/json/");
        const data = await res.json();
        info.ip = data.ip;
        info.city = data.city;
        info.region = data.region;
        info.country = data.country_name;
        info.org = data.org;
      } catch (e) {
        info.ip = "Fetch failed";
      }

      collectedData = info;
      
    }
